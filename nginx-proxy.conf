# Central Nginx Reverse Proxy for local development and production routing

# Map allowed origins for CORS
map $http_origin $allow_origin {
    default "";
    "~^http://(localhost|janaushadhi\.local|seller\.janaushadhi\.local|admin\.janaushadhi\.local)(:\d+)?$" "$http_origin";
}

server {
    listen 80;
    server_name janaushadhi.local;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

