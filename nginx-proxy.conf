# =============================================
# JAN AUSHADHI — Production Nginx Reverse Proxy
# =============================================
# Handles HTTPS termination, subdomain routing,
# CORS, security headers, and Let's Encrypt.
#
# Configure for janaushadhi.site.
# =============================================

# Map allowed origins for CORS
map $http_origin $allow_origin {
    default "";
    "~^https://(janaushadhi\.site|seller\.janaushadhi\.site|admin\.janaushadhi\.site)$" "$http_origin";
}

# ---- HTTP → HTTPS Redirect + ACME Challenge ----
server {
    listen 80;
    server_name janaushadhi.site seller.janaushadhi.site admin.janaushadhi.site api.janaushadhi.site;

    # Let's Encrypt ACME challenge endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Consumer Frontend (main domain) ----
server {
    listen 443 ssl http2;
    server_name janaushadhi.site;

    ssl_certificate /etc/letsencrypt/live/janaushadhi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janaushadhi.site/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Seller Central Portal ----
server {
    listen 443 ssl http2;
    server_name seller.janaushadhi.site;

    ssl_certificate /etc/letsencrypt/live/janaushadhi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janaushadhi.site/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://seller:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- Admin Console ----
server {
    listen 443 ssl http2;
    server_name admin.janaushadhi.site;

    ssl_certificate /etc/letsencrypt/live/janaushadhi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janaushadhi.site/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- API Backend ----
server {
    listen 443 ssl http2;
    server_name api.janaushadhi.site;

    ssl_certificate /etc/letsencrypt/live/janaushadhi.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janaushadhi.site/privkey.pem;

    # Allow larger request bodies (for potential prescription/image uploads)
    client_max_body_size 10M;

    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS configurations
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $allow_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' $allow_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, PATCH, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With,If-Modified-Since' always;
    }
}
