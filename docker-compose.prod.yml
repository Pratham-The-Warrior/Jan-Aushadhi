version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: janaushadhi-db-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: janaushadhi
    ports:
      - "5432:5432"
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: janaushadhi-redis-prod
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: janaushadhi-search-prod
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: production
    ports:
      - "7700:7700"
    volumes:
      - meilidata-prod:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: janaushadhi-backend-prod
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/janaushadhi
      - REDIS_URL=redis://redis:6379
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=masterKey
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    expose:
      - "5000"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: janaushadhi-frontend-prod
    expose:
      - "80"

  seller:
    build:
      context: ./apps/seller
      dockerfile: Dockerfile
    container_name: janaushadhi-seller-prod
    expose:
      - "80"

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: janaushadhi-admin-prod
    expose:
      - "80"

  nginx:
    image: nginx:stable-alpine
    container_name: janaushadhi-proxy-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - seller
      - admin
      - backend

volumes:
  pgdata-prod:
  meilidata-prod:
