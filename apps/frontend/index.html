<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JanAushadhi — Find cheaper generic medicines near you</title>
    <meta name="description" content="Compare your branded medicine with its Jan Aushadhi generic: same salt and strength, up to 90% cheaper. Find the nearest Jan Aushadhi Kendra." />
    <meta name="theme-color" content="#006A6A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Social sharing (WhatsApp, X, Facebook, LinkedIn). __SITE_URL__ is set from VITE_SITE_URL at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JanAushadhi" />
    <meta property="og:title" content="JanAushadhi — Same medicine. Up to 90% cheaper." />
    <meta property="og:description" content="Find the Jan Aushadhi generic for your branded medicine — same salt and strength — and the nearest Kendra that sells it." />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Shown until React mounts, so slow connections never see a blank page */
      #boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
              background: #f6f8f9; font: 600 15px system-ui, sans-serif; color: #3d5050; }
      #boot img { animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: .55; transform: scale(.94); } }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status"><img src="/favicon.svg" width="56" height="56" alt="" />Loading JanAushadhi…</div>
    </div>
    <noscript>
      <p style="padding:24px;font-family:system-ui,sans-serif">JanAushadhi needs JavaScript to search medicines. Please enable it in your browser settings.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
